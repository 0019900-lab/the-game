<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0420"><title>LAWLESS: Eat the Laws</title>
<style>
:root{--g:#f0c970;--g2:#ffe9a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#06021a;overflow:hidden;touch-action:none;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none;direction:ltr}
.pill{pointer-events:auto;background:linear-gradient(180deg,rgba(70,38,150,.88),rgba(24,10,70,.9));border:1.5px solid var(--g);border-radius:14px;padding:7px 12px;font-weight:800;font-size:14px;color:var(--g2);box-shadow:0 0 14px rgba(138,92,240,.5);min-width:42px;text-align:center;text-decoration:none;line-height:1.2}
.pill b{color:#fff}.pill.btn:active{transform:scale(.94)}
#mv{white-space:nowrap}#room{flex:1;font-size:12px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stars{letter-spacing:2px;font-size:15px}#stars i{font-style:normal;color:#4a3a80}#stars i.on{color:#ffd15a;text-shadow:0 0 8px #ffb300}
#acts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 104px);display:flex;justify-content:center;gap:14px;direction:ltr}#acts .pill{min-width:64px;font-size:18px;padding:6px 14px}
#modes{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:center;gap:10px;direction:ltr}
.mb{width:96px;height:78px;border-radius:20px;border:2px solid rgba(240,201,112,.45);background:linear-gradient(180deg,rgba(54,28,120,.85),rgba(18,8,56,.92));color:#cdbdff;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .18s}
.mb .ic{font-size:26px;line-height:1}.mb small{font-size:11px;opacity:.85;font-weight:600}
.mb.on{border-color:var(--g);color:#fff;transform:translateY(-6px) scale(1.06);box-shadow:0 0 24px rgba(240,201,112,.7),inset 0 0 18px rgba(138,92,240,.5)}
.mb.dis{opacity:.35}
#eat .ic{text-shadow:0 0 12px #9b6bff}#push .ic{text-shadow:0 0 12px #fff}#spit .ic{color:#ffd15a;text-shadow:0 0 12px #ffb300}
#tip{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 56px);text-align:center;font-size:14px;line-height:1.6;background:rgba(14,6,44,.86);border:1px solid rgba(240,201,112,.45);border-radius:14px;padding:9px 14px;opacity:0;transition:opacity .35s;pointer-events:none}
#tip.show{opacity:1}
#end,#sel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(6,2,26,.78);backdrop-filter:blur(5px)}
#end.show,#sel.show{display:flex;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
#end h2{margin:0;font-size:28px;letter-spacing:3px;color:var(--g2);text-shadow:0 0 22px rgba(240,201,112,.8)}
#end p{margin:0;color:#cfc3ff}#es{font-size:40px;letter-spacing:6px}#es i{font-style:normal;color:#3a2d70}#es i.on{color:#ffd15a;text-shadow:0 0 14px #ffb300}
.big{border:2px solid var(--g);background:linear-gradient(180deg,#5a33c0,#2a1380);color:#fff;font-weight:800;font-size:17px;padding:12px 30px;border-radius:16px;box-shadow:0 0 22px rgba(138,92,240,.7)}
.big.sm{font-size:14px;padding:9px 20px;background:rgba(30,14,80,.8)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px;max-width:380px;width:100%}
#grid button{aspect-ratio:1;border-radius:16px;border:2px solid rgba(240,201,112,.4);background:linear-gradient(180deg,rgba(54,28,120,.85),rgba(18,8,56,.92));color:#fff;font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#grid button small{font-size:11px;color:#ffd15a;letter-spacing:1px}#grid button.cur{border-color:var(--g);box-shadow:0 0 18px rgba(240,201,112,.6)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
</style></head><body>
<canvas id="cv"></canvas>
<div class="hud"><a class="pill btn" href="index.html">⌂</a><div class="pill btn" id="sel0">☰</div><div class="pill" id="room">—</div><div class="pill" id="mv"><b>0</b>/0</div></div>
<div id="acts"><div class="pill btn" id="undo">↶</div><div class="pill btn" id="hint">💡</div><div class="pill btn" id="rst">↻</div></div>
<div id="tip"></div>
<div id="modes"><button class="mb on" id="eat"><span class="ic">●</span>ابتلع<small>EAT</small></button><button class="mb" id="push"><span class="ic">○</span>ادفع<small>PUSH</small></button><button class="mb dis" id="spit"><span class="ic">✦</span>ابصق<small>SPIT</small></button></div>
<div id="end"><h2 id="endh">GATE UNSEALED</h2><div id="es"></div><p id="endp"></p><button class="big" id="nxt">الغرفة التالية</button><button class="big sm" id="again">أعد للتحسين</button></div>
<div id="sel"><h2 style="margin:0;color:#ffe9a8">اختر غرفة</h2><div id="grid"></div><button class="big sm" id="selx">إغلاق</button></div>
<script src="audio.js"></script><script src="vsim.js"></script><script src="vrooms.js"></script><script src="void.js"></script>
</body></html>
